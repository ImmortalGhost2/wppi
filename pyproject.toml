[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wallpath-pi"
version = "0.1.0"
description = "Propagation-guided sparse residual correction for indoor path-loss maps."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "WallPath-PI contributors"}
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "matplotlib>=3.8",
  "scikit-learn>=1.4",
  "joblib>=1.3",
  "tqdm>=4.66",
  "tabulate>=0.9"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider -p no:asyncio -p no:cov -p no:anyio -p no:json-report -p no:metadata"
